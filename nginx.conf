server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # This build uses Vite base=/ads/, so redirect root to that path.
  location = / {
    return 302 /ads/;
  }

  # Strip /ads/ prefix and serve the built SPA.
  location /ads/ {
    rewrite ^/ads/(.*)$ /$1 break;
    try_files $uri $uri/ /index.html;
  }
}

