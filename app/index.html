    <style>
      :root {
        color-scheme: dark;
        --ads-font-sans: "Segoe UI Variable Text", "Segoe UI Variable", Aptos, Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-family: var(--ads-font-sans);
        --m3-bg: #06100e;
        --m3-surface: rgba(14, 28, 25, 0.88);
        --m3-outline: rgba(160, 210, 198, 0.22);
        --m3-outline-strong: rgba(160, 210, 198, 0.42);
        --m3-primary: #7df0e2;
        --m3-primary-strong: #4ed8c8;
        --m3-primary-ink: #04211e;
        --m3-secondary: #9bb6ff;
        --m3-text: #f3f8f5;
        --m3-muted: #9fb6af;
        --m3-amber: #ffcd6b;
        --m3-easing: cubic-bezier(0.2, 0, 0, 1);
      }
      * { box-sizing: border-box; }
      html, body, #root { min-height: 100%; margin: 0; }
      body { background: var(--m3-bg); color: var(--m3-text); font-family: var(--ads-font-sans); font-weight: 430; -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
      .startup-splash {
        align-items: center;
        background:
          radial-gradient(circle at 24% 14%, rgba(125, 240, 226, 0.18), transparent 34%),
          radial-gradient(circle at 78% 82%, rgba(155, 182, 255, 0.12), transparent 36%),
          linear-gradient(rgba(125, 240, 226, 0.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(125, 240, 226, 0.045) 1px, transparent 1px),
          #050d0c;
        background-size: auto, auto, 30px 30px, 30px 30px;
        color: var(--m3-text);
        display: grid;
        height: 100vh;
        justify-items: center;
        overflow: hidden;
        padding: 28px;
        position: relative;
      }
      .startup-splash::before,
      .startup-splash::after {
        border-radius: 999px;
        content: "";
        filter: blur(8px);
        pointer-events: none;
        position: absolute;
      }
      .startup-splash::before { background: rgba(125, 240, 226, 0.12); height: 360px; left: -120px; top: -120px; width: 360px; }
      .startup-splash::after { background: rgba(255, 205, 107, 0.08); bottom: -140px; height: 320px; right: -90px; width: 320px; }
      .startup-orb { inset: 0; overflow: hidden; pointer-events: none; position: absolute; }
      .startup-orb span {
        animation: startup-orbit 8s ease-in-out infinite;
        background: rgba(125, 240, 226, 0.08);
        border: 1px solid rgba(125, 240, 226, 0.14);
        border-radius: 999px;
        height: 140px;
        position: absolute;
        width: 140px;
      }
      .startup-orb span:nth-child(1) { left: 12%; top: 20%; }
      .startup-orb span:nth-child(2) { animation-delay: -2.4s; right: 16%; top: 28%; }
      .startup-orb span:nth-child(3) { animation-delay: -4.2s; bottom: 14%; left: 45%; }
      .startup-card {
        background:
          linear-gradient(135deg, rgba(14, 28, 25, 0.88), rgba(5, 13, 12, 0.94)),
          radial-gradient(circle at 18% 0%, rgba(125, 240, 226, 0.2), transparent 44%);
        border: 1px solid rgba(125, 240, 226, 0.26);
        border-radius: 30px;
        box-shadow: 0 34px 90px -48px rgba(125, 240, 226, 0.95), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        display: grid;
        gap: 18px;
        max-width: 520px;
        overflow: hidden;
        padding: 26px;
        position: relative;
        width: min(520px, calc(100vw - 48px));
        z-index: 1;
      }
      .startup-card::before {
        animation: startup-shine 2.9s ease-in-out infinite;
        background: linear-gradient(110deg, transparent 0%, transparent 30%, rgba(255, 255, 255, 0.18) 46%, rgba(125, 240, 226, 0.28) 51%, transparent 68%, transparent 100%);
        border-radius: inherit;
        content: "";
        inset: -1px;
        opacity: 0;
        pointer-events: none;
        position: absolute;
        transform: translateX(-120%);
      }
      .startup-brand-row { align-items: center; display: grid; gap: 14px; grid-template-columns: auto 1fr; }
      .startup-brand-mark {
        align-items: center;
        background: radial-gradient(circle at 30% 28%, #eafffb, var(--m3-primary) 48%, var(--m3-primary-strong));
        border-radius: 19px;
        box-shadow: 0 14px 34px -14px rgba(125, 240, 226, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.38);
        color: var(--m3-primary-ink);
        display: inline-flex;
        font-size: 13px;
        font-weight: 680;
        height: 54px;
        justify-content: center;
        letter-spacing: 0.08em;
        width: 54px;
      }
      .startup-brand-row h1 { font-size: 24px; font-weight: 640; letter-spacing: -0.032em; margin: 0; }
      .startup-brand-row p { color: var(--m3-muted); font-size: 13px; margin: 5px 0 0; }
      .startup-progress {
        background: rgba(255, 255, 255, 0.045);
        border: 1px solid rgba(125, 240, 226, 0.12);
        border-radius: 999px;
        height: 10px;
        overflow: hidden;
        position: relative;
      }
      .startup-progress span {
        animation: startup-progress 1.15s ease-in-out infinite;
        background: linear-gradient(90deg, rgba(125, 240, 226, 0), rgba(125, 240, 226, 0.95), rgba(255, 205, 107, 0.78), rgba(125, 240, 226, 0));
        border-radius: inherit;
        display: block;
        height: 100%;
        width: 46%;
      }
      .startup-steps { display: grid; gap: 8px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .startup-steps span {
        background: rgba(255, 255, 255, 0.035);
        border: 1px solid rgba(125, 240, 226, 0.12);
        border-radius: 14px;
        color: var(--m3-muted);
        font-size: 11px;
        font-weight: 560;
        padding: 9px 10px;
        text-align: center;
      }
      @keyframes startup-progress { 0% { transform: translateX(-105%); } 100% { transform: translateX(225%); } }
      @keyframes startup-shine { 0%, 46% { opacity: 0; transform: translateX(-120%); } 54% { opacity: 1; } 82%, 100% { opacity: 0; transform: translateX(120%); } }
      @keyframes startup-orbit { 0%, 100% { transform: translate3d(0, 0, 0) scale(0.92); opacity: 0.38; } 50% { transform: translate3d(18px, -14px, 0) scale(1.08); opacity: 0.7; } }
      @media (max-width: 560px) { .startup-steps { grid-template-columns: 1fr; } }
    </style>
